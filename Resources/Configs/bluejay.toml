#
# Boot Shim Configs
#
[boot_shim]
# UniXNU's pack stage checks that the shim's arm64 header names FD_BASE as
# text_offset. Tensor ABL rejects a nonzero text_offset (docs/EVIDENCE.md), so
# bluejay cannot satisfy that check; the shim is position independent and copies
# the FD itself. apply.sh still emits the header, with text_offset 0, which is
# what the firmware-only image already booted with.
requires_kernel_header = false

#
# UEFI FD Configs
#
# The FD is copied to this address by the boot shim. It is the 20 MiB gap
# between abl@f8800000 (+16 MiB) and the bootloader framebuffer at 0xfac00000,
# measured from the bluejay FDT (docs/EVIDENCE.md). Not a value reported by ABL.
#
[uefi_fd]
base = 0xF9800000
size = 0x200000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
